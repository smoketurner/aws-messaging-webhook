[package]
name = "mailbox-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The mail table: keys, transaction planning, the Table seam and the Mailbox over it"
publish = false

[features]
memory = []

[dependencies]
anyhow = { workspace = true, features = ["std"] }
aws-sdk-dynamodb = { workspace = true, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-smithy-types.workspace = true
base64 = { workspace = true, features = ["std"] }
mailbox.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_dynamo = { workspace = true, features = ["aws-sdk-dynamodb+1"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
mailbox = { workspace = true, features = ["test-fixtures"] }
mailbox-store = { workspace = true, features = ["memory"] }
proptest = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
