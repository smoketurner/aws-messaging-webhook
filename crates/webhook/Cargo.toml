[package]
name = "aws-messaging-webhook"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Webhook receiver for AWS End User Messaging and SES events delivered over SNS"
publish = false

[[bin]]
name = "aws-messaging-webhook"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aws-config = { workspace = true, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-dynamodb = { workspace = true, features = ["default-https-client", "rt-tokio"] }
aws-sdk-eventbridge = { workspace = true, features = ["default-https-client", "rt-tokio"] }
aws-sdk-pinpointsmsvoicev2 = { workspace = true, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sesv2 = { workspace = true, features = ["default-https-client", "rt-tokio"] }
axum.workspace = true
lambda_http.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sns-message-verifier.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["trace"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true

[lints]
workspace = true
