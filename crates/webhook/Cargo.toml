[package]
name = "aws-messaging-webhook"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Webhook receiver for AWS End User Messaging and SES events delivered over SNS"
publish = false

[[bin]]
name = "aws-messaging-webhook"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
aws-config = { workspace = true, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-dynamodb = { workspace = true, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-eventbridge = { workspace = true, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-pinpointsmsvoicev2 = { workspace = true, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-s3 = { workspace = true, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-sesv2 = { workspace = true, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-ssm = { workspace = true, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-smithy-types.workspace = true
aws_lambda_events = { workspace = true, features = ["dynamodb"] }
axum = { workspace = true, features = ["json", "query"] }
# rev5 addition, ahead of §9's phase-2 listing: mail::keys::PageToken (D11) is
# an F1 (phase 1) deliverable and needs base64url now.
base64 = { workspace = true, features = ["std"] }
lambda_http = { workspace = true, features = ["apigw_http", "tracing"] }
mail-parser.workspace = true
metrics.workspace = true
metrics_cloudwatch_embedded = { workspace = true, features = ["lambda"] }
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
serde_dynamo = { workspace = true, features = ["aws-sdk-dynamodb+1"] }
sha2 = { workspace = true, features = ["std"] }
sns-message-verifier.workspace = true
subtle.workspace = true
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower-http = { workspace = true, features = ["sensitive-headers", "trace"] }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v7"] }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }
sns-message-verifier = { workspace = true, features = ["test-fixtures"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tower = { workspace = true, features = ["util"] }
webhook-test-support.workspace = true
wiremock.workspace = true

[lints]
workspace = true
