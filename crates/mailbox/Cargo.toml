[package]
name = "mailbox"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Mailbox domain types, MIME parsing and building, and wire shapes"
publish = false

[features]
# A sample `MailMessage` for other crates' unit tests.
test-fixtures = []

[dependencies]
anyhow = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
mail-builder.workspace = true
mail-parser.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_dynamo.workspace = true
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
structured-email-address = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v7"] }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true
