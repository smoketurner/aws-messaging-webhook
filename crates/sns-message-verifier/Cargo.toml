[package]
name = "sns-message-verifier"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Verify AWS SNS message signatures (SignatureVersion 1 and 2) for HTTPS webhook endpoints"
publish = false

[features]
# Throwaway keys, self-signed certs, and envelope signing for tests of code
# that consumes this crate. Never enable in production builds.
test-fixtures = ["dep:rand", "rsa/sha1", "rsa/sha2", "x509-cert/builder"]

[dependencies]
base64 = { workspace = true, features = ["std"] }
rand = { workspace = true, features = ["std", "std_rng"], optional = true }
reqwest = { workspace = true, features = ["rustls"] }
rsa = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sha1 = { workspace = true, features = ["std", "oid"] }
sha2 = { workspace = true, features = ["std", "oid"] }
thiserror = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }
x509-cert = { workspace = true, features = ["std", "pem"] }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }
sns-message-verifier = { path = ".", features = ["test-fixtures"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
