AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Webhook receiver for AWS End User Messaging and SES events delivered over
  SNS: verifies signatures, persists an event-sourced record to DynamoDB,
  performs lifecycle actions, and re-publishes to an EventBridge bus.
  Optionally hosts a mailbox on SES (pMailDomain).

Parameters:
  pStage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  pLogRetentionDays:
    Type: Number
    Default: 30
  pLogLevel:
    Type: String
    Default: INFO
    # No TRACE: at TRACE the Lambda runtime logs raw invoke payloads and the
    # AWS SDK logs full requests and responses, which leaks secrets.
    AllowedValues: [DEBUG, INFO, WARN, ERROR]
  pAllowedTopics:
    Type: String
    Default: ""
    Description: >-
      Comma-separated allowlist: 12-digit account ids and/or TopicArn globs.
      Empty allows every topic — development only; the function logs a loud
      warning at startup.
  pAutoResubscribe:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  pEventSource:
    Type: String
    Default: aws-messaging-webhook
    Description: The `source` field on published EventBridge events.
  pOptOutListName:
    Type: String
    Default: ""
    Description: >-
      End User Messaging opt-out list updated by STOP/START keywords. Empty
      disables that action.
  pRawEventRetentionDays:
    Type: Number
    Default: 30
  pAggregateRetentionDays:
    Type: Number
    Default: 365
    Description: >-
      TTL (days) for the per-message aggregate item. Kept separate from — and
      typically longer than — pRawEventRetentionDays so a message's rolled-up
      current state outlives its bulky raw event items.
  pConsumerAccountIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      12-digit AWS account ids allowed to assume the read-only consumer role and
      query the events table directly (e.g. to fetch a record whose EventBridge
      payload was omitted for size). Empty (the default) creates no role and
      grants no cross-account access.
  pMailDomain:
    Type: String
    Default: ""
    AllowedPattern: ^$|^([a-z0-9-]+\.)+[a-z]{2,}$
    Description: >-
      Receiving domain and sending identity of the mailbox, e.g.
      mail.example.com. Empty (the default) creates no mail resource.
  pMailInbox:
    Type: String
    Default: ""
    AllowedPattern: ^$|^[a-z0-9._+-]{1,64}$
    Description: >-
      Local part of the one inbox at pMailDomain, e.g. hello for
      hello@mail.example.com. Required when pMailDomain is set.
  pMailSenderMaxConcurrency:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 100
    Description: >-
      How many sends may run at once. Each concurrent execution can make one
      SES call at a time, so this is the ceiling on the send rate this stack
      asks SES for; raise it only alongside the account's sending quota.
  pMailBucketName:
    Type: String
    Default: ""
    AllowedPattern: ^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
    Description: Mail bucket name. Empty lets CloudFormation generate one.
  pMailRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: >-
      How long a message is kept: S3 expiration for inbound raw MIME,
      attachments, message content documents and sent raw MIME, and the TTL on
      mail table message, thread and alias items. Never applies to outbox/.
  pHostedZoneId:
    Type: String
    Default: ""
    AllowedPattern: ^$|^Z[A-Z0-9]+$
    Description: >-
      Route 53 hosted zone for pMailDomain. When set the stack publishes every
      mail DNS record; when empty the DnsRecords output lists them.
  pDmarcPolicy:
    Type: String
    Default: quarantine
    AllowedValues: [none, quarantine, reject]
  pMailTrackingDomain:
    Type: String
    Default: ""
    AllowedPattern: ^$|^([a-z0-9-]+\.)+[a-z]{2,}$
    Description: >-
      Custom subdomain SES wraps open and click tracking links in, e.g.
      click.mail.example.com. Empty (the default) leaves them on SES's own
      awstrack.me domain; opens and clicks are reported either way. A
      subdomain of pMailDomain needs no verification of its own; any other
      domain must already be a verified SES identity.
  pMailTrackingHttpsPolicy:
    Type: String
    Default: OPTIONAL
    AllowedValues: [OPTIONAL, REQUIRE, REQUIRE_OPEN_ONLY]
    Description: >-
      Scheme SES wraps the tracking links in. OPTIONAL, the default, is what a
      bare CNAME to SES can serve: the open pixel over HTTP and each click link
      on the scheme it already had. REQUIRE and REQUIRE_OPEN_ONLY need the
      subdomain fronted by a CDN holding a certificate for it — see
      pMailTrackingCnameTarget.
  pMailTrackingCnameTarget:
    Type: String
    Default: ""
    AllowedPattern: ^$|^([a-z0-9-]+\.)+[a-z]{2,}$
    Description: >-
      Host pMailTrackingDomain's CNAME points at. Empty (the default) uses
      SES's regional tracking domain, r.<region>.awstrack.me. Set it to your
      CDN's hostname when serving the subdomain over HTTPS.
  pReceiptTlsPolicy:
    Type: String
    Default: Optional
    AllowedValues: [Optional, Require]
  pExistingReceiptRuleSetName:
    Type: String
    Default: ""
    AllowedPattern: ^$|^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
    Description: >-
      Empty creates a receipt rule set (activate it after deploy). Set it to
      add the rule to a rule set that already exists and is active in this
      region.
  pApiKeysParameterName:
    Type: String
    Default: ""
    # SSM reserves names beginning with aws or ssm, in any case.
    AllowedPattern: ^$|^/(?![Aa][Ww][Ss]|[Ss][Ss][Mm])[A-Za-z0-9_./-]{1,1010}$
    Description: >-
      Name, starting with "/" but not "/aws" or "/ssm", of the SecureString SSM
      parameter holding the /v0 API key hashes. Create the parameter after deploy.
  pApiKeysKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: ^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$
    Description: Customer-managed KMS key of the API key parameter. Empty means aws/ssm.
  pAttachmentUrlTtlSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 3600
    Description: Lifetime of presigned attachment and raw-message download URLs.

Rules:
  MailParametersRequired:
    RuleCondition: !Not [!Equals [!Ref pMailDomain, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref pMailInbox, ""]]
        AssertDescription: pMailInbox is required when pMailDomain is set.
      # Both functions refuse to start without it.
      - Assert: !Not [!Equals [!Ref pApiKeysParameterName, ""]]
        AssertDescription: pApiKeysParameterName is required when pMailDomain is set.
  # Tracking options live on the mailbox configuration set, so without a
  # mailbox they would be accepted and then quietly do nothing.
  MailTrackingNeedsMailDomain:
    RuleCondition: !Equals [!Ref pMailDomain, ""]
    Assertions:
      - Assert: !Equals [!Ref pMailTrackingDomain, ""]
        AssertDescription: pMailTrackingDomain needs pMailDomain.
  MailTrackingOptionsNeedTrackingDomain:
    RuleCondition: !Equals [!Ref pMailTrackingDomain, ""]
    Assertions:
      - Assert: !Equals [!Ref pMailTrackingHttpsPolicy, OPTIONAL]
        AssertDescription: pMailTrackingHttpsPolicy needs pMailTrackingDomain.
      - Assert: !Equals [!Ref pMailTrackingCnameTarget, ""]
        AssertDescription: pMailTrackingCnameTarget needs pMailTrackingDomain.

Conditions:
  cIsProd: !Equals [!Ref pStage, prod]
  cHasOptOutList: !Not [!Equals [!Ref pOptOutListName, ""]]
  # A CommaDelimitedList defaulting to "" yields a single empty-string element.
  cHasConsumers: !Not [!Equals [!Select [0, !Ref pConsumerAccountIds], ""]]
  cHasMailDomain: !Not [!Equals [!Ref pMailDomain, ""]]
  cHasHostedZone: !And [!Condition cHasMailDomain, !Not [!Equals [!Ref pHostedZoneId, ""]]]
  cNoHostedZone: !And [!Condition cHasMailDomain, !Equals [!Ref pHostedZoneId, ""]]
  cHasTrackingDomain: !And [!Condition cHasMailDomain, !Not [!Equals [!Ref pMailTrackingDomain, ""]]]
  cHasTrackingCnameTarget: !Not [!Equals [!Ref pMailTrackingCnameTarget, ""]]
  cTrackingRecordUnpublished: !And [!Condition cHasTrackingDomain, !Equals [!Ref pHostedZoneId, ""]]
  cCreateReceiptRuleSet: !And [!Condition cHasMailDomain, !Equals [!Ref pExistingReceiptRuleSetName, ""]]
  cHasMailBucketName: !Not [!Equals [!Ref pMailBucketName, ""]]
  cHasApiKeys: !And [!Condition cHasMailDomain, !Not [!Equals [!Ref pApiKeysParameterName, ""]]]
  cHasApiKeysKmsKey: !And [!Condition cHasApiKeys, !Not [!Equals [!Ref pApiKeysKmsKeyArn, ""]]]
  cHasAllowedTopics: !Not [!Equals [!Ref pAllowedTopics, ""]]
  cAllowlistMailTopics: !And [!Condition cHasMailDomain, !Condition cHasAllowedTopics]

# Both functions are the same Rust binary on the same runtime; only their
# FUNCTION_MODE, sizing and permissions differ.
Globals:
  Function:
    CodeUri: .
    Handler: bootstrap
    Runtime: provided.al2023
    Architectures: [arm64]

Resources:
  rWebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        # Workspace build: pick the webhook binary explicitly.
        Binary: aws-messaging-webhook
    Properties:
      # Mail ingest parses up to 40 MB of MIME inside one invocation.
      MemorySize: !If [cHasMailDomain, 512, 256]
      Timeout: !If [cHasMailDomain, 90, 10]
      FunctionUrlConfig:
        AuthType: NONE
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: !Ref pLogLevel
        SystemLogLevel: INFO
        LogGroup: !Ref rFunctionLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref rEventsTable
          EVENT_BUS_NAME: !Ref rEventBus
          EVENT_SOURCE: !Ref pEventSource
          # The stack-owned mail topics join a non-empty allowlist; an empty
          # allowlist already allows them.
          ALLOWED_TOPICS: !If
            - cAllowlistMailTopics
            - !Join [",", [!Ref pAllowedTopics, !Ref rMailInboundTopic, !Ref rMailEventsTopic]]
            - !Ref pAllowedTopics
          AUTO_RESUBSCRIBE: !Ref pAutoResubscribe
          OPT_OUT_LIST_NAME: !Ref pOptOutListName
          RAW_EVENT_RETENTION_DAYS: !Ref pRawEventRetentionDays
          AGGREGATE_RETENTION_DAYS: !Ref pAggregateRetentionDays
          STACK_NAME: !Ref AWS::StackName
          MAIL_DOMAIN: !If [cHasMailDomain, !Ref pMailDomain, !Ref AWS::NoValue]
          MAIL_TABLE_NAME: !If [cHasMailDomain, !Ref rMailTable, !Ref AWS::NoValue]
          MAIL_BUCKET: !If [cHasMailDomain, !Ref rMailBucket, !Ref AWS::NoValue]
          MAIL_INBOX: !If [cHasMailDomain, !Sub "${pMailInbox}@${pMailDomain}", !Ref AWS::NoValue]
          SES_CONFIGURATION_SET: !If [cHasMailDomain, !Ref rMailConfigurationSet, !Ref AWS::NoValue]
          MAIL_IDENTITY_ARN: !If
            - cHasMailDomain
            - !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${pMailDomain}"
            - !Ref AWS::NoValue
          API_KEYS_PARAMETER: !If [cHasApiKeys, !Ref pApiKeysParameterName, !Ref AWS::NoValue]
          ATTACHMENT_URL_TTL_SECONDS: !If [cHasMailDomain, !Ref pAttachmentUrlTtlSeconds, !Ref AWS::NoValue]
          MAIL_RETENTION_DAYS: !If [cHasMailDomain, !Ref pMailRetentionDays, !Ref AWS::NoValue]
      Policies:
        - Statement:
            - Sid: PersistEvents
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt rEventsTable.Arn
            - Sid: PublishEvents
              Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt rEventBus.Arn
            - !If
              - cHasOptOutList
              - Sid: ManageOptOuts
                Effect: Allow
                Action:
                  - sms-voice:PutOptedOutNumber
                  - sms-voice:DeleteOptedOutNumber
                Resource: !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:opt-out-list/${pOptOutListName}"
              - !Ref AWS::NoValue
            # PutMessageFeedback acts on a message id and
            # PutSuppressedDestination on the account-level suppression list —
            # neither exposes a resource ARN to scope to.
            - Sid: MessageFeedback
              Effect: Allow
              Action: sms-voice:PutMessageFeedback
              Resource: "*"
            - Sid: SuppressionList
              Effect: Allow
              Action: ses:PutSuppressedDestination
              Resource: "*"
            # rEventsStreamMapping is a standalone resource rather than a SAM
            # DynamoDB event, so these reads are granted here. The SAM event
            # attaches AWSLambdaDynamoDBExecutionRole instead, which allows
            # stream reads on every table in the account.
            - Sid: EventsStreamRead
              Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
              Resource: !GetAtt rEventsTable.StreamArn
            - Sid: ListStreams
              Effect: Allow
              Action: dynamodb:ListStreams
              Resource: "*"
            # The stream event-source mapping routes records that exhaust their
            # retries to this queue; the function role needs to write to it.
            - Sid: PublishOnFailureDlq
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt rPublishDlq.Arn
            # The async-invoke on-failure destination is written by Lambda
            # using this role.
            - Sid: AsyncInvokeOnFailureDlq
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt rAsyncInvokeDlq.Arn
            # Mail statements. Transactions are authorized through the item
            # actions. No ses:SendEmail (only the sender sends) and no S3 delete.
            - !If
              - cHasMailDomain
              - Sid: MailTableReadWrite
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt rMailTable.Arn
                  - !Sub "${rMailTable.Arn}/index/*"
              - !Ref AWS::NoValue
            - !If
              - cHasMailDomain
              - Sid: MailStreamRead
                Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                Resource: !GetAtt rMailTable.StreamArn
              - !Ref AWS::NoValue
            - !If
              - cHasMailDomain
              - Sid: MailObjectsRead
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${rMailBucket.Arn}/inbound/*"
                  - !Sub "${rMailBucket.Arn}/attachments/*"
                  - !Sub "${rMailBucket.Arn}/messages/*"
                  - !Sub "${rMailBucket.Arn}/sent/*"
                  - !Sub "${rMailBucket.Arn}/outbox/*"
              - !Ref AWS::NoValue
            - !If
              - cHasMailDomain
              - Sid: MailObjectsWrite
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub "${rMailBucket.Arn}/attachments/*"
                  - !Sub "${rMailBucket.Arn}/messages/*"
                  - !Sub "${rMailBucket.Arn}/outbox/*"
              - !Ref AWS::NoValue
            # Without ListBucket, S3 answers GetObject/HeadObject on a missing
            # key with 403 instead of 404, and a missing object would look
            # like a transient failure. The code never lists the bucket.
            - !If
              - cHasMailDomain
              - Sid: MailObjectsNotFound
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt rMailBucket.Arn
              - !Ref AWS::NoValue
            - !If
              - cHasMailDomain
              - Sid: MailIdentityStatus
                Effect: Allow
                Action: ses:GetEmailIdentity
                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${pMailDomain}"
              - !Ref AWS::NoValue
            - !If
              - cHasApiKeys
              - Sid: ApiKeysRead
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${pApiKeysParameterName}"
              - !Ref AWS::NoValue
            - !If
              - cHasApiKeysKmsKey
              - Sid: ApiKeysDecrypt
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref pApiKeysKmsKeyArn
              - !Ref AWS::NoValue

  # Unnamed like the rest: each function's LoggingConfig points at its own
  # group by reference, and the WebhookLogGroupName output carries the
  # generated name. Lambda's basic execution policy covers any log group.
  rFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref pLogRetentionDays

  rEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      DeletionProtectionEnabled: !If [cIsProd, true, false]

  rEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${AWS::StackName}-events"

  # On-failure destination for the stream relay: an event whose publish exhausts
  # its retries lands here instead of being lost. Alarm on its depth.
  rPublishDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  # Read-only role for downstream consumers in other AWS accounts: assume it,
  # then GetItem the AGG item or Query pk = MSG#<messageId> to fetch a record
  # whose EventBridge payload was omitted for size, or a message's full
  # timeline. Base-table reads only — no write, no Scan, and no access to the
  # index (scoped to the table ARN, not index ARNs).
  # Unnamed on purpose: a RoleName makes the stack need CAPABILITY_NAMED_IAM,
  # which turns setting pConsumerAccountIds into a failed deploy. Consumers
  # take the ARN from the ConsumerReadRoleArn output.
  rConsumerReadRole:
    Type: AWS::IAM::Role
    Condition: cHasConsumers
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref pConsumerAccountIds
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadMessageItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt rEventsTable.Arn

  # ---------------------------------------------------------------------------
  # Mailbox (pMailDomain). Everything below is conditional, so a stack without a
  # mail domain is unchanged. The two mail SNS topics are the only topics the
  # stack owns: a receipt rule and an event destination must name their topic.
  # ---------------------------------------------------------------------------

  # Without pMailTrackingDomain, SES wraps the open pixel and click links in
  # its own awstrack.me domain. The custom subdomain puts them on a domain the
  # recipient recognizes; SES still serves them, through the CNAME below.
  rMailConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Condition: cHasMailDomain
    Properties:
      TrackingOptions: !If
        - cHasTrackingDomain
        - CustomRedirectDomain: !Ref pMailTrackingDomain
          HttpsPolicy: !Ref pMailTrackingHttpsPolicy
        - !Ref AWS::NoValue

  rMailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: cHasMailDomain
    Properties:
      EmailIdentity: !Ref pMailDomain
      DkimAttributes:
        SigningEnabled: true
      MailFromAttributes:
        MailFromDomain: !Sub "bounce.${pMailDomain}"
        BehaviorOnMxFailure: USE_DEFAULT_VALUE
      # Every send from the identity is stamped with the set, so delivery
      # events flow even if a caller omits it.
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref rMailConfigurationSet

  rMailEventsTopic:
    Type: AWS::SNS::Topic
    Condition: cHasMailDomain
    Properties:
      SignatureVersion: "2"

  rMailEventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: cHasMailDomain
    Properties:
      Topics:
        - !Ref rMailEventsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesEventPublishing
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref rMailEventsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${rMailConfigurationSet}"

  rMailEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Condition: cHasMailDomain
    DependsOn: rMailEventsTopicPolicy
    Properties:
      ConfigurationSetName: !Ref rMailConfigurationSet
      EventDestination:
        Name: mail-events
        Enabled: true
        # Every event type SES defines, unconditionally. model/ maps all ten
        # to a detail-type already, and one the aggregate has no status rule
        # for is still persisted and forwarded — a missing type here is the
        # only way an event is lost outright. pMailTrackingDomain changes the
        # domain the open pixel and the rewritten links wear, never whether
        # they are reported.
        MatchingEventTypes:
          - send
          - reject
          - bounce
          - complaint
          - delivery
          - open
          - click
          - renderingFailure
          - deliveryDelay
          - subscription
        SnsDestination:
          TopicARN: !Ref rMailEventsTopic

  # Mail outlives the stack. outbox/ has no lifecycle rule: nothing a queued,
  # sending or unknown message needs may expire.
  rMailBucket:
    Type: AWS::S3::Bucket
    Condition: cHasMailDomain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [cHasMailBucketName, !Ref pMailBucketName, !Ref AWS::NoValue]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-inbound
            Status: Enabled
            Prefix: inbound/
            ExpirationInDays: !Ref pMailRetentionDays
          - Id: expire-attachments
            Status: Enabled
            Prefix: attachments/
            ExpirationInDays: !Ref pMailRetentionDays
          # Message content documents. Mail table items carry a TTL of the
          # same length, so a message and its content age out together.
          - Id: expire-messages
            Status: Enabled
            Prefix: messages/
            ExpirationInDays: !Ref pMailRetentionDays
          - Id: expire-sent
            Status: Enabled
            Prefix: sent/
            ExpirationInDays: !Ref pMailRetentionDays

  rMailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: cHasMailDomain
    Properties:
      Bucket: !Ref rMailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The rule ARN is built from names: a !Ref to rMailReceiptRule would be
          # circular, since the rule depends on this policy.
          - Sid: SesReceiptWrites
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${rMailBucket.Arn}/inbound/raw/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub
                  - "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${RuleSet}:receipt-rule/${AWS::StackName}-inbound"
                  - RuleSet: !If [cCreateReceiptRuleSet, !Ref rMailReceiptRuleSet, !Ref pExistingReceiptRuleSetName]
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt rMailBucket.Arn
              - !Sub "${rMailBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  rMailInboundTopic:
    Type: AWS::SNS::Topic
    Condition: cHasMailDomain
    Properties:
      SignatureVersion: "2"

  rMailInboundTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: cHasMailDomain
    Properties:
      Topics:
        - !Ref rMailInboundTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesReceiptPublishing
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref rMailInboundTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub
                  - "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${RuleSet}:receipt-rule/${AWS::StackName}-inbound"
                  - RuleSet: !If [cCreateReceiptRuleSet, !Ref rMailReceiptRuleSet, !Ref pExistingReceiptRuleSetName]

  # CloudFormation cannot activate a rule set; see the README post-deploy steps.
  rMailReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Condition: cCreateReceiptRuleSet

  rMailReceiptRule:
    Type: AWS::SES::ReceiptRule
    Condition: cHasMailDomain
    # SES checks it can write to the bucket and publish to the topic when the
    # rule is created.
    DependsOn:
      - rMailBucketPolicy
      - rMailInboundTopicPolicy
    Properties:
      RuleSetName: !If [cCreateReceiptRuleSet, !Ref rMailReceiptRuleSet, !Ref pExistingReceiptRuleSetName]
      Rule:
        # The one name the stack still sets: the bucket and topic policies
        # scope their SES condition to this rule's ARN, and referencing the
        # rule from a policy the rule itself depends on would be a cycle.
        Name: !Sub "${AWS::StackName}-inbound"
        Enabled: true
        ScanEnabled: true
        TlsPolicy: !Ref pReceiptTlsPolicy
        Recipients:
          - !Sub "${pMailInbox}@${pMailDomain}"
        Actions:
          - S3Action:
              BucketName: !Ref rMailBucket
              ObjectKeyPrefix: inbound/raw/
              TopicArn: !Ref rMailInboundTopic

  # The mailbox table. Its stream has exactly two readers — the relay
  # (rMailStreamMapping) and the sender — which is DynamoDB's recommended
  # ceiling; a third consumer needs Kinesis Data Streams for DynamoDB.
  rMailTable:
    Type: AWS::DynamoDB::Table
    Condition: cHasMailDomain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
        - AttributeName: gsi3pk
          AttributeType: S
        - AttributeName: gsi3sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByTime
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByThread
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Sparse: only send-state items carry gsi3pk.
        - IndexName: ByStatus
          KeySchema:
            - AttributeName: gsi3pk
              KeyType: HASH
            - AttributeName: gsi3sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      # Set on message, thread and send-state items, and on idempotency keys.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [cIsProd, true, false]

  # Separate from rAsyncInvokeDlq: a message here is mail that failed to go
  # out, which is a different problem from mail that failed to come in, and
  # an operator should not have to tell them apart by reading payloads.
  rMailSenderDlq:
    Type: AWS::SQS::Queue
    Condition: cHasMailDomain
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  # Every asynchronous invocation of the function — the stack's mail topics and
  # any SNS topic subscribed over the lambda protocol — retries twice in
  # Lambda's async queue and then lands here. Unconditional: a stack without a
  # mailbox still takes direct SNS invocations, and dropping those after two
  # retries loses the event.
  rAsyncInvokeDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  rWebhookEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref rWebhookFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt rAsyncInvokeDlq.Arn

  rMailInboundPermission:
    Type: AWS::Lambda::Permission
    Condition: cHasMailDomain
    Properties:
      FunctionName: !GetAtt rWebhookFunction.Arn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref rMailInboundTopic

  rMailInboundSubscription:
    Type: AWS::SNS::Subscription
    Condition: cHasMailDomain
    DependsOn: rMailInboundPermission
    Metadata:
      cfn-lint:
        config:
          # W3694 misreads the SAM function's Arn attribute; a lambda-protocol
          # subscription endpoint is exactly the function ARN.
          ignore_checks: [W3694]
    Properties:
      TopicArn: !Ref rMailInboundTopic
      Protocol: lambda
      Endpoint: !GetAtt rWebhookFunction.Arn

  rMailEventsPermission:
    Type: AWS::Lambda::Permission
    Condition: cHasMailDomain
    Properties:
      FunctionName: !GetAtt rWebhookFunction.Arn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref rMailEventsTopic

  rMailEventsSubscription:
    Type: AWS::SNS::Subscription
    Condition: cHasMailDomain
    DependsOn: rMailEventsPermission
    Metadata:
      cfn-lint:
        config:
          # W3694 misreads the SAM function's Arn attribute; a lambda-protocol
          # subscription endpoint is exactly the function ARN.
          ignore_checks: [W3694]
    Properties:
      TopicArn: !Ref rMailEventsTopic
      Protocol: lambda
      Endpoint: !GetAtt rWebhookFunction.Arn

  # The sender: the same binary in its other mode, reached only through the
  # mail table's stream. It is a separate function so its concurrency, memory
  # and IAM are scoped to sending, and so a slow send cannot occupy the
  # function serving the API.
  rMailSenderFunction:
    Type: AWS::Serverless::Function
    Condition: cHasMailDomain
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        Binary: aws-messaging-webhook
    Properties:
      # Holds the assembled message and its base64 form in memory at once.
      MemorySize: 1024
      Timeout: 120
      # One SES call at a time per environment keeps a burst of queued mail
      # from running into the account's sending rate.
      ReservedConcurrentExecutions: !Ref pMailSenderMaxConcurrency
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: !Ref pLogLevel
        SystemLogLevel: INFO
        LogGroup: !Ref rMailSenderLogGroup
      Environment:
        Variables:
          FUNCTION_MODE: sender
          STACK_NAME: !Ref AWS::StackName
          MAIL_DOMAIN: !Ref pMailDomain
          MAIL_TABLE_NAME: !Ref rMailTable
          MAIL_BUCKET: !Ref rMailBucket
          MAIL_INBOX: !Sub "${pMailInbox}@${pMailDomain}"
          # Never read in sender mode, but the shared mail config requires it.
          API_KEYS_PARAMETER: !Ref pApiKeysParameterName
          SES_CONFIGURATION_SET: !Ref rMailConfigurationSet
          MAIL_IDENTITY_ARN: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${pMailDomain}"
          ATTACHMENT_URL_TTL_SECONDS: !Ref pAttachmentUrlTtlSeconds
          MAIL_RETENTION_DAYS: !Ref pMailRetentionDays
      Events:
        # A sender killed between claiming a send and recording its outcome
        # leaves the state `sending` with nobody working on it and no stream
        # record to re-trigger. Nothing else would notice, so this checks.
        Sweep:
          Type: Schedule
          Properties:
            Schedule: rate(10 minutes)
            Description: Recover sends whose sender died mid-flight
      Policies:
        - Version: "2012-10-17"
          Statement:
            # TransactWriteItems authorizes through the item actions its
            # writes use — PutItem/UpdateItem/DeleteItem/ConditionCheckItem —
            # and is not itself an IAM action (see the API operations table in
            # https://docs.aws.amazon.com/service-authorization/latest/reference/list_dynamodb.html).
            # The sender's claim, SES-call marker and mark writes are Puts and
            # Updates.
            - Sid: MailTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt rMailTable.Arn
                - !Sub "${rMailTable.Arn}/index/*"
            # Nothing under outbox/ expires: the sender deletes a send's objects
            # once its outcome is settled.
            - Sid: OutboxObjects
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "${rMailBucket.Arn}/outbox/*"
            - Sid: SentObjects
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${rMailBucket.Arn}/sent/*"
            # A 404 rather than a 403 for a missing key needs ListBucket.
            - Sid: OutboxList
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt rMailBucket.Arn
            # Scoped to this domain's identity and this stack's configuration
            # set: the sender cannot send as another domain. The sender sends
            # raw MIME, which SESv2 SendEmail authorizes as ses:SendRawEmail.
            - Sid: SendMail
              Effect: Allow
              Action: ses:SendRawEmail
              Resource:
                - !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${pMailDomain}"
                - !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${rMailConfigurationSet}"
            # rMailSenderStreamMapping is a standalone resource, so SAM grants
            # none of the stream or on-failure permissions it needs.
            - Sid: MailStreamRead
              Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
              Resource: !GetAtt rMailTable.StreamArn
            - Sid: ListStreams
              Effect: Allow
              Action: dynamodb:ListStreams
              Resource: "*"
            - Sid: SenderOnFailureDlq
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt rMailSenderDlq.Arn

  rMailSenderLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: cHasMailDomain
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RetentionInDays: !Ref pLogRetentionDays

  # Send-state items only, and only while they are queued. The filter keeps
  # the sender from being invoked for its own claim and mark writes, which
  # move the status away from `queued`.
  rMailSenderStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: cHasMailDomain
    DependsOn: rMailSenderFunctionRole
    Properties:
      EventSourceArn: !GetAtt rMailTable.StreamArn
      FunctionName: !Ref rMailSenderFunction
      StartingPosition: TRIM_HORIZON
      # One record at a time: a batch that fails partway would otherwise
      # re-deliver sends that already reached SES.
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0
      MaximumRetryAttempts: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"sk":{"S":["STATE"]},"send_status":{"S":["queued"]}}}}'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt rMailSenderDlq.Arn

  # The events-table relay: the sole publisher of event details to
  # EventBridge. Retries a failed publish, bisects a poison batch, reports
  # per-record failures, and routes anything past the retry limit to the DLQ
  # so a publish can never be silently lost.
  rEventsStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn: rWebhookFunctionRole
    Properties:
      EventSourceArn: !GetAtt rEventsTable.StreamArn
      FunctionName: !Ref rWebhookFunction
      StartingPosition: TRIM_HORIZON
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 5
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures
      # Event-item INSERTs (the events) and aggregate INSERT/MODIFYs (status
      # transitions). TTL REMOVEs are dropped. Event items are write-once, so
      # they only ever INSERT.
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["INSERT","MODIFY"]}'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt rPublishDlq.Arn

  # The mail relay: message items only (sk MSG#). An INSERT publishes a
  # received message, a MODIFY the system labels that write added (sent,
  # delivered, bounced, complained, rejected, opened). Send-state, marker,
  # key, alias, thread and inbox items never invoke the relay.
  rMailStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: cHasMailDomain
    DependsOn: rWebhookFunctionRole
    Properties:
      EventSourceArn: !GetAtt rMailTable.StreamArn
      FunctionName: !Ref rWebhookFunction
      StartingPosition: TRIM_HORIZON
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"sk":{"S":[{"prefix":"MSG#"}]}}}}'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt rPublishDlq.Arn

  rMailDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: cHasHostedZone
    Properties:
      HostedZoneId: !Ref pHostedZoneId
      RecordSets:
        - Name: !Ref pMailDomain
          Type: MX
          TTL: "300"
          ResourceRecords:
            - !Sub "10 inbound-smtp.${AWS::Region}.amazonaws.com"
        - Name: !GetAtt rMailIdentity.DkimDNSTokenName1
          Type: CNAME
          TTL: "300"
          ResourceRecords:
            - !GetAtt rMailIdentity.DkimDNSTokenValue1
        - Name: !GetAtt rMailIdentity.DkimDNSTokenName2
          Type: CNAME
          TTL: "300"
          ResourceRecords:
            - !GetAtt rMailIdentity.DkimDNSTokenValue2
        - Name: !GetAtt rMailIdentity.DkimDNSTokenName3
          Type: CNAME
          TTL: "300"
          ResourceRecords:
            - !GetAtt rMailIdentity.DkimDNSTokenValue3
        - Name: !Sub "bounce.${pMailDomain}"
          Type: MX
          TTL: "300"
          ResourceRecords:
            - !Sub "10 feedback-smtp.${AWS::Region}.amazonses.com"
        - Name: !Sub "bounce.${pMailDomain}"
          Type: TXT
          TTL: "300"
          ResourceRecords:
            - '"v=spf1 include:amazonses.com ~all"'
        - Name: !Ref pMailDomain
          Type: TXT
          TTL: "300"
          ResourceRecords:
            - '"v=spf1 include:amazonses.com -all"'
        - Name: !Sub "_dmarc.${pMailDomain}"
          Type: TXT
          TTL: "300"
          ResourceRecords:
            - !Sub '"v=DMARC1; p=${pDmarcPolicy}"'
        - !If
          - cHasTrackingDomain
          - Name: !Ref pMailTrackingDomain
            Type: CNAME
            TTL: "300"
            ResourceRecords:
              - !If
                - cHasTrackingCnameTarget
                - !Ref pMailTrackingCnameTarget
                - !Sub "r.${AWS::Region}.awstrack.me"
          - !Ref AWS::NoValue

Outputs:
  WebhookUrl:
    Description: Base Function URL (trailing slash included).
    Value: !GetAtt rWebhookFunctionUrl.FunctionUrl
  SmsInboundEndpoint:
    Description: Subscribe your EUM two-way SMS inbound topic to this URL.
    Value: !Sub "${rWebhookFunctionUrl.FunctionUrl}webhooks/sms/inbound"
  SmsEventsEndpoint:
    Description: Subscribe your EUM configuration-set event destination topic to this URL.
    Value: !Sub "${rWebhookFunctionUrl.FunctionUrl}webhooks/sms/events"
  SesEventsEndpoint:
    Description: Subscribe your SES configuration-set event destination topic to this URL.
    Value: !Sub "${rWebhookFunctionUrl.FunctionUrl}webhooks/ses/events"
  SesInboundEndpoint:
    Description: Subscribe your SES receipt-rule SNS topic to this URL.
    Value: !Sub "${rWebhookFunctionUrl.FunctionUrl}webhooks/ses/inbound"
  WebhookFunctionArn:
    Description: Function ARN for direct SNS -> Lambda subscriptions.
    Value: !GetAtt rWebhookFunction.Arn
  WebhookFunctionName:
    Description: Generated name of the webhook function, for aws lambda invoke and sam logs.
    Value: !Ref rWebhookFunction
  WebhookLogGroupName:
    Description: CloudWatch log group the webhook function writes to.
    Value: !Ref rFunctionLogGroup
  EventBusName:
    Value: !Ref rEventBus
  EventBusArn:
    Value: !GetAtt rEventBus.Arn
  TableName:
    Value: !Ref rEventsTable
  PublishDlqUrl:
    Description: SQS DLQ for stream-relay events that exhausted their publish retries.
    Value: !Ref rPublishDlq
  AsyncInvokeDlqUrl:
    Description: SQS DLQ for direct (lambda-protocol) SNS deliveries that failed every async-invoke retry.
    Value: !Ref rAsyncInvokeDlq
  ConsumerReadRoleArn:
    Condition: cHasConsumers
    Description: Role ARN for downstream consumers to assume for read-only table access.
    Value: !GetAtt rConsumerReadRole.Arn
  MailTableName:
    Condition: cHasMailDomain
    Value: !Ref rMailTable
  MailBucketName:
    Condition: cHasMailDomain
    Value: !Ref rMailBucket
  MailInboundTopicArn:
    Condition: cHasMailDomain
    Description: Stack-owned topic for SES receipt notifications (already subscribed).
    Value: !Ref rMailInboundTopic
  MailEventsTopicArn:
    Condition: cHasMailDomain
    Description: Stack-owned topic for SES configuration-set events (already subscribed).
    Value: !Ref rMailEventsTopic
  MailConfigurationSetName:
    Condition: cHasMailDomain
    Value: !Ref rMailConfigurationSet
  MailTrackingDomain:
    Condition: cHasTrackingDomain
    Description: Custom domain SES wraps open and click tracking links in.
    Value: !Ref pMailTrackingDomain
  InboxAddress:
    Condition: cHasMailDomain
    Value: !Sub "${pMailInbox}@${pMailDomain}"
  ApiBaseUrl:
    Condition: cHasMailDomain
    Description: Base URL of the mailbox API.
    Value: !Sub "${rWebhookFunctionUrl.FunctionUrl}v0"
  ReceiptRuleSetName:
    Condition: cHasMailDomain
    Description: Receipt rule set holding the mail rule. Activate it once after the first deploy.
    Value: !If [cCreateReceiptRuleSet, !Ref rMailReceiptRuleSet, !Ref pExistingReceiptRuleSetName]
  MailSenderFunctionName:
    Condition: cHasMailDomain
    Description: Generated name of the mail sender function, for the operator resend and sweep commands.
    Value: !Ref rMailSenderFunction
  MailSenderLogGroupName:
    Condition: cHasMailDomain
    Description: CloudWatch log group the mail sender writes to.
    Value: !Ref rMailSenderLogGroup
  MailSenderDlqUrl:
    Condition: cHasMailDomain
    Description: SQS DLQ for sends that failed every retry. A message here is mail that did not go out.
    Value: !Ref rMailSenderDlq
  DnsRecords:
    Condition: cNoHostedZone
    Description: Mail DNS records to publish (no pHostedZoneId given).
    Value: !Join
      - "\n"
      - - !Sub "${pMailDomain} MX 10 inbound-smtp.${AWS::Region}.amazonaws.com"
        - !Sub "${rMailIdentity.DkimDNSTokenName1} CNAME ${rMailIdentity.DkimDNSTokenValue1}"
        - !Sub "${rMailIdentity.DkimDNSTokenName2} CNAME ${rMailIdentity.DkimDNSTokenValue2}"
        - !Sub "${rMailIdentity.DkimDNSTokenName3} CNAME ${rMailIdentity.DkimDNSTokenValue3}"
        - !Sub "bounce.${pMailDomain} MX 10 feedback-smtp.${AWS::Region}.amazonses.com"
        - !Sub 'bounce.${pMailDomain} TXT "v=spf1 include:amazonses.com ~all"'
        - !Sub '${pMailDomain} TXT "v=spf1 include:amazonses.com -all"'
        - !Sub '_dmarc.${pMailDomain} TXT "v=DMARC1; p=${pDmarcPolicy}"'
  # Its own output rather than a line in DnsRecords: the tracking subdomain is
  # optional, and where it points depends on whether a CDN fronts it.
  TrackingDnsRecord:
    Condition: cTrackingRecordUnpublished
    Description: Tracking-domain DNS record to publish (no pHostedZoneId given).
    Value: !If
      - cHasTrackingCnameTarget
      - !Sub "${pMailTrackingDomain} CNAME ${pMailTrackingCnameTarget}"
      - !Sub "${pMailTrackingDomain} CNAME r.${AWS::Region}.awstrack.me"
