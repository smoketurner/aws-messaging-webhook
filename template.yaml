AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Webhook receiver for AWS End User Messaging and SES events delivered over
  SNS: verifies signatures, persists an event-sourced record to DynamoDB,
  performs lifecycle actions, and re-publishes to an EventBridge bus.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  LogRetentionDays:
    Type: Number
    Default: 30
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [TRACE, DEBUG, INFO, WARN, ERROR]
  AllowedTopics:
    Type: String
    Default: ""
    Description: >-
      Comma-separated allowlist: 12-digit account ids and/or TopicArn globs.
      Empty allows every topic — development only; the function logs a loud
      warning at startup.
  AutoResubscribe:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  EventSource:
    Type: String
    Default: aws-messaging-webhook
    Description: The `source` field on published EventBridge events.
  OptOutListName:
    Type: String
    Default: ""
    Description: >-
      End User Messaging opt-out list updated by STOP/START keywords. Empty
      disables that action.
  RawEventRetentionDays:
    Type: Number
    Default: 30
  AggregateRetentionDays:
    Type: Number
    Default: 365
    Description: >-
      TTL (days) for the per-message aggregate item. Kept separate from — and
      typically longer than — RawEventRetentionDays so a message's rolled-up
      current state outlives its bulky raw event items.
  ConsumerAccountIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      12-digit AWS account ids allowed to assume the read-only consumer role and
      query the events table directly (e.g. to fetch a record whose EventBridge
      payload was omitted for size). Empty (the default) creates no role and
      grants no cross-account access.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  HasOptOutList: !Not [!Equals [!Ref OptOutListName, ""]]
  # A CommaDelimitedList defaulting to "" yields a single empty-string element.
  HasConsumers: !Not [!Equals [!Select [0, !Ref ConsumerAccountIds], ""]]

Resources:
  WebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        # Workspace build: pick the webhook binary explicitly.
        Binary: aws-messaging-webhook
    Properties:
      FunctionName: !Sub "${AWS::StackName}-webhook"
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      FunctionUrlConfig:
        AuthType: NONE
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: !Ref LogLevel
        SystemLogLevel: INFO
        LogGroup: !Ref FunctionLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref EventsTable
          EVENT_BUS_NAME: !Ref EventBus
          EVENT_SOURCE: !Ref EventSource
          ALLOWED_TOPICS: !Ref AllowedTopics
          AUTO_RESUBSCRIBE: !Ref AutoResubscribe
          OPT_OUT_LIST_NAME: !Ref OptOutListName
          RAW_EVENT_RETENTION_DAYS: !Ref RawEventRetentionDays
          AGGREGATE_RETENTION_DAYS: !Ref AggregateRetentionDays
          STACK_NAME: !Ref AWS::StackName
      Events:
        # The stream relay: the sole publisher of event details to EventBridge.
        # Retries a failed publish, bisects a poison batch, reports per-record
        # failures, and routes anything past the retry limit to the DLQ so a
        # publish can never be silently lost.
        StreamRelay:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt EventsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 5
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
            # Event-item INSERTs (the events) and aggregate INSERT/MODIFYs
            # (status transitions). TTL REMOVEs are dropped. Event items are
            # write-once, so they only ever INSERT.
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"]}'
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt PublishDlq.Arn
      Policies:
        - Statement:
            - Sid: PersistEvents
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt EventsTable.Arn
            - Sid: PublishEvents
              Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn
            - !If
              - HasOptOutList
              - Sid: ManageOptOuts
                Effect: Allow
                Action:
                  - sms-voice:PutOptedOutNumber
                  - sms-voice:DeleteOptedOutNumber
                Resource: !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:opt-out-list/${OptOutListName}"
              - !Ref AWS::NoValue
            # PutMessageFeedback acts on a message id and
            # PutSuppressedDestination on the account-level suppression list —
            # neither exposes a resource ARN to scope to.
            - Sid: MessageFeedback
              Effect: Allow
              Action: sms-voice:PutMessageFeedback
              Resource: "*"
            - Sid: SuppressionList
              Effect: Allow
              Action: sesv2:PutSuppressedDestination
              Resource: "*"
            # The stream event-source mapping routes records that exhaust their
            # retries to this queue; the function role needs to write to it.
            - Sid: PublishOnFailureDlq
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt PublishDlq.Arn

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-webhook"
      RetentionInDays: !Ref LogRetentionDays

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]

  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${AWS::StackName}-events"

  # On-failure destination for the stream relay: an event whose publish exhausts
  # its retries lands here instead of being lost. Alarm on its depth.
  PublishDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-publish-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  # Read-only role for downstream consumers in other AWS accounts: assume it,
  # then GetItem the AGG item or Query pk = MSG#<messageId> to fetch a record
  # whose EventBridge payload was omitted for size, or a message's full
  # timeline. Base-table reads only — no write, no Scan, and no access to the
  # internal ReconcileIndex (scoped to the table ARN, not index ARNs).
  ConsumerReadRole:
    Type: AWS::IAM::Role
    Condition: HasConsumers
    Properties:
      RoleName: !Sub "${AWS::StackName}-consumer-read"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ConsumerAccountIds
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadMessageItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt EventsTable.Arn

Outputs:
  WebhookUrl:
    Description: Base Function URL (trailing slash included).
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  SmsInboundEndpoint:
    Description: Subscribe your EUM two-way SMS inbound topic to this URL.
    Value: !Sub "${WebhookFunctionUrl.FunctionUrl}webhooks/sms/inbound"
  SmsEventsEndpoint:
    Description: Subscribe your EUM configuration-set event destination topic to this URL.
    Value: !Sub "${WebhookFunctionUrl.FunctionUrl}webhooks/sms/events"
  SesEventsEndpoint:
    Description: Subscribe your SES configuration-set event destination topic to this URL.
    Value: !Sub "${WebhookFunctionUrl.FunctionUrl}webhooks/ses/events"
  SesInboundEndpoint:
    Description: Subscribe your SES receipt-rule SNS topic to this URL.
    Value: !Sub "${WebhookFunctionUrl.FunctionUrl}webhooks/ses/inbound"
  WebhookFunctionArn:
    Description: Function ARN for direct SNS -> Lambda subscriptions.
    Value: !GetAtt WebhookFunction.Arn
  EventBusName:
    Value: !Ref EventBus
  EventBusArn:
    Value: !GetAtt EventBus.Arn
  TableName:
    Value: !Ref EventsTable
  PublishDlqUrl:
    Description: SQS DLQ for stream-relay events that exhausted their publish retries.
    Value: !Ref PublishDlq
  ConsumerReadRoleArn:
    Condition: HasConsumers
    Description: Role ARN for downstream consumers to assume for read-only table access.
    Value: !GetAtt ConsumerReadRole.Arn
