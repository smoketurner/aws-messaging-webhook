name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Dependencies compile the same whether or not deny/clippy/tests pass;
          # without this, a streak of red runs means every run builds cold.
          cache-on-failure: true
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The suite runs once. Coverage is a local tool (`cargo llvm-cov`): in
      # CI it rebuilt the workspace instrumented, which doubled the wait for
      # an lcov report nothing consumed.
      - run: cargo test --workspace
      - run: cargo deny check

  sam-validate:
    name: SAM template lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SAM_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/setup-sam@v3
      - run: sam validate --lint

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: zizmor@1.32.0
      # actionlint is a Go tool; install-action only carries Rust-ecosystem manifests.
      - name: Install actionlint
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/actionlint.tar.gz actionlint
      - run: /tmp/actionlint
      - run: zizmor --no-online-audits .github/workflows/

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    name: Actions lockfile
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
