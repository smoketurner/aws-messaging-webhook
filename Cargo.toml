[workspace]
resolver = "3"
members = [
  "crates/sns-message-verifier",
  "crates/webhook",
  "crates/webhook-test-support",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smoketurner/aws-messaging-webhook"

[workspace.dependencies]
anyhow = { version = "=1.0.104", default-features = false }
aws-config = { version = "=1.11.0", default-features = false }
aws-messaging-webhook = { path = "crates/webhook" }
aws-sdk-dynamodb = { version = "=1.123.0", default-features = false }
aws-sdk-eventbridge = { version = "=1.115.0", default-features = false }
aws-sdk-pinpointsmsvoicev2 = { version = "=1.120.0", default-features = false }
aws-sdk-s3 = { version = "=1.144.0", default-features = false }
aws-sdk-sesv2 = { version = "=1.132.0", default-features = false }
aws-sdk-ssm = { version = "=1.121.0", default-features = false }
aws-smithy-types = { version = "=1.6.3", default-features = false }
aws_lambda_events = { version = "=1.2.0", default-features = false }
axum = { version = "=0.8.9", default-features = false }
base64 = { version = "=0.23.1", default-features = false }
lambda_http = { version = "=1.3.1", default-features = false }
mail-builder = { version = "=1.0.0", default-features = false }
mail-parser = { version = "=0.11.9", default-features = false }
metrics = { version = "=0.24.6", default-features = false }
metrics_cloudwatch_embedded = { version = "=0.10.0", default-features = false }
mime = { version = "=0.3.17", default-features = false }
proptest = { version = "=1.11.0", default-features = false }
rand = { version = "=0.10.2", default-features = false }
reqwest = { version = "=0.13.5", default-features = false }
rsa = { version = "=0.9.10", default-features = false }
serde = { version = "=1.0.229", default-features = false }
serde_dynamo = { version = "=4.3.0", default-features = false }
serde_json = { version = "=1.0.151", default-features = false }
sha1 = { version = "=0.10.7", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
sns-message-verifier = { path = "crates/sns-message-verifier" }
subtle = { version = "=2.6.1", default-features = false }
thiserror = { version = "=2.0.20", default-features = false }
tokio = { version = "=1.53.1", default-features = false }
tower = { version = "=0.5.3", default-features = false }
tower-http = { version = "=0.7.1", default-features = false }
tracing = { version = "=0.1.44", default-features = false }
url = { version = "=2.5.8", default-features = false }
uuid = { version = "=1.26.1", default-features = false }
webhook-test-support = { path = "crates/webhook-test-support" }
wiremock = { version = "=0.6.5", default-features = false }
x509-cert = { version = "=0.3.0", default-features = false }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
