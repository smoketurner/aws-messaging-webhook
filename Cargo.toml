[workspace]
resolver = "3"
members = [
  "crates/mailbox",
  "crates/mailbox-store",
  "crates/sns-message-verifier",
  "crates/webhook",
  "crates/webhook-test-support",
]

[workspace.package]
edition = "2024"
rust-version = "1.100.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smoketurner/aws-messaging-webhook"

[workspace.dependencies]
anyhow = { version = "=1.0.104", default-features = false }
aws-config = { version = "=1.13.3", default-features = false }
aws-messaging-webhook = { path = "crates/webhook" }
aws-sdk-dynamodb = { version = "=1.140.0", default-features = false }
aws-sdk-eventbridge = { version = "=1.130.0", default-features = false }
aws-sdk-pinpointsmsvoicev2 = { version = "=1.137.0", default-features = false }
aws-sdk-s3 = { version = "=1.159.0", default-features = false }
aws-sdk-sesv2 = { version = "=1.149.0", default-features = false }
aws-sdk-ssm = { version = "=1.138.0", default-features = false }
aws-smithy-types = { version = "=1.9.4", default-features = false }
aws_lambda_events = { version = "=1.2.1", default-features = false }
axum = { version = "=0.8.9", default-features = false }
base64 = { version = "=0.23.1", default-features = false }
bytes = { version = "=1.12.2", default-features = false }
jiff = { version = "=1.0.3", default-features = false }
lambda_http = { version = "=1.3.2", default-features = false }
mailbox = { path = "crates/mailbox" }
mailbox-store = { path = "crates/mailbox-store" }
mail-builder = { version = "=2.0.1", default-features = false }
mail-parser = { version = "=1.0.1", default-features = false }
metrics = { version = "=0.24.6", default-features = false }
metrics_cloudwatch_embedded = { version = "=0.10.0", default-features = false }
mime = { version = "=0.3.18", default-features = false }
proptest = { version = "=1.12.0", default-features = false }
rand = { version = "=0.8.8", default-features = false }
reqwest = { version = "=0.13.5", default-features = false }
rsa = { version = "=0.9.10", default-features = false }
serde = { version = "=1.0.229", default-features = false }
serde_dynamo = { version = "=4.3.0", default-features = false }
serde_json = { version = "=1.0.154", default-features = false }
sha1 = { version = "=0.10.7", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
sns-message-verifier = { path = "crates/sns-message-verifier" }
structured-email-address = { version = "=0.0.22", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
thiserror = { version = "=2.0.21", default-features = false }
tokio = { version = "=1.54.1", default-features = false }
tower = { version = "=0.5.3", default-features = false }
tower-http = { version = "=0.7.1", default-features = false }
tracing = { version = "=0.1.44", default-features = false }
url = { version = "=2.5.9", default-features = false }
uuid = { version = "=1.29.3", default-features = false }
webhook-test-support = { path = "crates/webhook-test-support" }
wiremock = { version = "=0.6.5", default-features = false }
x509-cert = { version = "=0.2.5", default-features = false }

[workspace.lints.rust]
unsafe_code           = "deny"
unreachable_pub       = "warn"
non_ascii_idents      = "deny"
trivial_casts         = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes      = "warn"
single_use_lifetimes  = "warn"
unused_qualifications = "warn"
unused_import_braces  = "warn"
unused_macro_rules    = "warn"
let_underscore_drop   = "warn"
redundant_lifetimes   = "warn"
unit_bindings         = "warn"
elided_lifetimes_in_paths     = "warn"
explicit_outlives_requirements = "warn"
meta_variable_misuse  = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
# Whole pedantic group on as warnings; specific rules below override it.
pedantic = { level = "warn", priority = -1 }

# Own-crate items are imported with `use`, not spelled inline as deep paths.
# Configured in `clippy.toml` (`absolute-paths-*`) so only `crate::` and the
# workspace crates' paths are reported.
absolute_paths = "deny"

# Panic prevention
unwrap_used         = "deny"
expect_used         = "deny"
panic               = "deny"
unreachable         = "deny"
todo                = "deny"
unimplemented       = "deny"
exit                = "deny"
unwrap_in_result    = "deny"
panic_in_result_fn  = "deny"
get_unwrap          = "deny"

# Indexing / slicing can panic — prefer .get()
indexing_slicing    = "deny"
string_slice        = "deny"

# Arithmetic that can panic or silently misbehave
modulo_arithmetic       = "deny"
integer_division        = "deny"
arithmetic_side_effects = "deny"

# Lossy / surprising numeric `as` casts
cast_possible_truncation = "deny"
cast_sign_loss           = "deny"
cast_possible_wrap       = "deny"
cast_precision_loss      = "deny"
checked_conversions      = "deny"

# Time / float hazards
unchecked_time_subtraction = "deny"
float_cmp           = "deny"
float_cmp_const     = "deny"
lossy_float_literal = "deny"
zero_divided_by_zero = "deny"

# Conversions / formatting that hide panics
fallible_impl_from   = "deny"
recursive_format_impl = "deny"

# Stack / iteration hazards
large_stack_arrays  = "deny"
large_stack_frames  = "deny"
infinite_iter       = "deny"

# Uninitialized memory / UB
mem_replace_with_uninit = "deny"
uninit_assumed_init     = "deny"
uninit_vec              = "deny"

# Async / concurrency safety
await_holding_lock = "deny"
large_futures      = "deny"
mem_forget         = "deny"
mutex_atomic       = "deny"

# Hygiene
dbg_macro          = "deny"
print_stdout       = "deny"
print_stderr       = "deny"
rc_buffer          = "deny"
map_unwrap_or      = "deny"
let_underscore_must_use = "deny"

# Clarity: say what is meant, without needless work
clone_on_ref_ptr        = "deny"
deref_by_slicing        = "deny"
needless_collect        = "deny"
needless_pass_by_ref_mut = "deny"
needless_raw_strings    = "deny"
or_fun_call             = "deny"
redundant_clone         = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
str_to_string           = "deny"
string_add              = "deny"
format_push_string      = "deny"
use_self                = "deny"
if_then_some_else_none  = "deny"
useless_let_if_seq      = "deny"
equatable_if_let        = "deny"
branches_sharing_code   = "deny"
unnecessary_self_imports = "deny"
unnecessary_struct_initialization = "deny"
unneeded_field_pattern  = "deny"
rest_pat_in_fully_bound_structs = "deny"
empty_structs_with_brackets = "deny"
empty_enum_variants_with_brackets = "deny"
empty_drop              = "deny"
trait_duplication_in_bounds = "deny"
type_repetition_in_bounds = "deny"
iter_on_single_items    = "deny"
iter_on_empty_collections = "deny"
nonstandard_macro_braces = "deny"
derive_partial_eq_without_eq = "deny"

# Results and values that are silently dropped or never used
let_underscore_untyped  = "deny"
unused_result_ok        = "deny"
try_err                 = "deny"
collection_is_never_read = "deny"
unused_peekable         = "deny"

# Likely bugs
significant_drop_in_scrutinee = "deny"
mixed_read_write_in_expression = "deny"
debug_assert_with_mut_call = "deny"
suspicious_xor_used_as_pow = "deny"
set_contains_or_insert  = "deny"
read_zero_byte_vec      = "deny"
path_buf_push_overwrite = "deny"
pathbuf_init_then_push  = "deny"
filetype_is_file        = "deny"
fn_to_numeric_cast_any  = "deny"
as_underscore           = "deny"
infinite_loop           = "deny"
non_send_fields_in_send_ty = "deny"
string_lit_as_bytes     = "deny"
string_lit_chars_any    = "deny"
verbose_file_reads      = "deny"
clear_with_drain        = "deny"
while_float             = "deny"
imprecise_flops         = "deny"
suboptimal_flops        = "deny"
mutex_integer           = "deny"
rc_mutex                = "deny"

# Tests
cfg_not_test            = "deny"
redundant_test_prefix   = "deny"

# No silent escape hatches: every allow must justify itself (use #[expect]).
allow_attributes              = "deny"
allow_attributes_without_reason = "deny"

# Ratchet against monolithic functions.
too_many_lines = "warn"

# Pedantic relaxations (too noisy for this codebase style).
module_name_repetitions = "allow"
similar_names           = "allow"
# Its fix is `assert_eq!(x, [] as [T; 0])`, which needs `Debug + PartialEq` and reads worse.
assert_is_empty         = "allow"

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
